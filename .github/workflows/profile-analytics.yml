
name: Update Profile Analytics

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-analytics.yml"
      - "scripts/generate_profile_analytics.py"

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analytics SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ORLAND0HENRY
        run: python scripts/generate_profile_analytics.py

      - name: Commit generated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "Analytics have not changed."
            exit 0
          fi

          git commit -m "Update GitHub profile analytics"
          git push

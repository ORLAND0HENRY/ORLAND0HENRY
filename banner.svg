<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <radialGradient id="cyberBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#cyberBg)" rx="20"/>

  <g opacity="0.08" stroke="#f59e0b" stroke-width="1">
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30"/>
    </pattern>
    <rect width="1200" height="420" fill="url(#gridPattern)"/>
  </g>

  <circle cx="950" cy="120" r="180" fill="#f59e0b" opacity="0.07" filter="url(#amberGlow)" />

  <text x="70" y="160" fill="#eff4ff" font-family="'Impact', 'Arial Black', sans-serif" font-size="100" font-weight="900" letter-spacing="3">
    HELLO!
  </text>
  <text x="70" y="250" fill="#eff4ff" font-family="'Impact', 'Arial Black', sans-serif" font-size="100" font-weight="900" letter-spacing="3">
    I'M ORLANTECH
  </text>

  <text x="630" y="275" fill="#f59e0b" font-family="'Brush Script MT', 'Georgia', cursive" font-size="115" font-style="italic" transform="rotate(-5 630 275)" filter="url(#amberGlow)">
    Innovations
  </text>

  <rect x="70" y="295" width="480" height="36" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="85" y="319" fill="#fbbf24" font-family="'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="2">
    &gt; FULL-STACK DJANGO // ETHICAL HACKER
  </text>

  <rect x="70" y="360" width="1060" height="2" fill="url(#accentLine)"/>

  <text x="70" y="390" fill="#94a3b8" font-family="'Courier New', monospace" font-size="13" letter-spacing="1">
    SYSTEM STATUS: ● OPERATIONAL | ARCHITECTURE: DJANGO 5.0+ | DEFENSE: HARDENED
  </text>
</svg>
